version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agentconnect-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agentconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: agentconnect-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentconnect-backend
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgrespassword@db:5432/agentconnect
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=agentconnect-production-secret-key-super-secure-32chars
      - LLM_PROVIDER=deterministic
      - EMBEDDING_PROVIDER=deterministic
      - RELEVANCE_THRESHOLD=0.75
      - TOP_K_CANDIDATES=50
      - WEBHOOK_TIMEOUT=10
      - MAX_WEBHOOK_RETRIES=3
      - ALLOW_PRIVATE_IPS=true
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python -m app.main"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentconnect-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
